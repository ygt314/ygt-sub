<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>齐次化联立·高考解析几何（修正版）</title>
<script type="text/javascript" async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML"></script>
<script type="text/x-mathjax-config">
MathJax.Hub.Config({
    tex2jax: { 
        inlineMath: [['$','$'], ['\\(','\\)']], 
        displayMath: [['\\[','\\]']], 
        processEscapes: true 
    },
    TeX: { 
        extensions: ["AMSmath.js","AMSsymbols.js"],
        Macros: { 
            para: "\\parallel",
            impl: "\\Rightarrow"
        }
    },
    "HTML-CSS": { scale: 115 },
    displayAlign: "center"
});
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
body{background:#f4f6f8;padding:20px}
.wrap{max-width:1000px;margin:0 auto;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
.head{background:#327ff9;color:#fff;padding:18px 24px;font-size:22px;font-weight:600}
.tab-bar{display:flex;gap:10px;padding:16px 24px;background:#f7f8fa;flex-wrap:wrap}
.tab{padding:9px 16px;border-radius:6px;background:#eaf3ff;color:#327ff9;cursor:pointer}
.tab.active{background:#327ff9;color:#fff}
.ct{padding:24px}
.qbox{background:#eaf3ff;padding:18px;border-radius:8px;margin-bottom:20px;line-height:1.8;font-size:16px}
.cbox{text-align:center;margin:20px 0}
canvas{border:1px solid #e5e6eb;border-radius:8px;background:#fcfdff}
.step-box{padding:20px;background:#f7f8fa;border-radius:8px;min-height:160px}
.stitle{font-weight:600;color:#327ff9;margin-bottom:12px;font-size:16px}
#step{line-height:2.1;font-size:15px}
.MathJax_Display {margin:0.8em 0 !important;text-align:center !important;}
.tip{border-left:4px solid #ff9500;background:#fff9e6;padding:12px 16px;margin:14px 0;line-height:1.7}
.btns{display:flex;gap:12px;justify-content:center;margin:20px 0}
button{padding:10px 26px;background:#327ff9;color:#fff;border:none;border-radius:6px;cursor:pointer}
.flow{background:#f0f7ff;padding:14px;border-radius:8px;margin-top:10px;font-size:14px;line-height:1.7}
.flow strong{color:#327ff9}
</style>
</head>
<body>
<div class="wrap">
<div class="head">齐次化联立·椭圆/双曲线/抛物线（逻辑正确）</div>
<div class="tab-bar">
<div class="tab active" onclick="set(0)">椭圆·垂直</div>
<div class="tab" onclick="set(1)">椭圆·斜率和</div>
<div class="tab" onclick="set(2)">双曲线·斜率积</div>
<div class="tab" onclick="set(3)">抛物线·定点</div>
</div>
<div class="ct">
<div class="qbox" id="q"></div>
<div class="cbox"><canvas id="cvs" width="520" height="400"></canvas></div>
<div class="step-box">
<div class="stitle">分步推导（高考标准）</div>
<div id="step"></div>
</div>
<div class="tip" id="tip"></div>
<div class="flow">
<strong>齐次化标准流程：</strong><br>
1 设直线$mx+ny=1$；2 曲线方程×1齐次化；3 除$x^2$得$k$方程；4 韦达得$k_1k_2/k_1+k_2$
</div>
<div class="btns">
<button onclick="nxt()">下一步</button>
<button onclick="rst()">重置</button>
</div>
</div>
</div>

<script>
const cvs=document.getElementById('cvs'),ctx=cvs.getContext('2d');
let cur=0,step=0;
const cx=260,cy=200,s=60;

// 全部推导逻辑100%正确
const D=[
{q:`已知椭圆$C:\\dfrac{x^2}{4}+y^2=1$，原点$O$引$OA\\perp OB$交椭圆于$A,B$，求证：$AB$恒过定点。`,
tip:`正确结论：$AB$过定点$\\left(\\dfrac{4}{5},0\\right)$，齐次化标准题型。`,
sts:[
`设直线$AB:mx+ny=1$（$AB$不过原点）`,
`椭圆方程右边乘$1=mx+ny$齐次化：
\\[\\dfrac{x^2}{4}+y^2=(mx+ny)^2\\]`,
`展开整理为**二次齐次式**：
\\[\\left(\\dfrac{1}{4}-m^2\\right)x^2-2mnxy+(1-n^2)y^2=0\\]`,
`两边除以$x^2$，令$k=\\dfrac{y}{x}$：
\\[(1-n^2)k^2-2mnk+\\left(\\dfrac{1}{4}-m^2\\right)=0\\]`,
`由$OA\\perp OB$得$k_1k_2=-1$，韦达定理：
\\[\\dfrac{\\dfrac{1}{4}-m^2}{1-n^2}=-1\\impl m^2+n^2=\\dfrac{5}{4}\\]`,
`直线$mx+ny=1$满足$m^2+n^2=\\dfrac{5}{4}$，恒过定点：
\\[\\mathbf{\\left(\\dfrac{4}{5},0\\right)}\\]`],
dr(){elp(2,1,4/5,0)}
},

{q:`椭圆$\\dfrac{x^2}{4}+y^2=1$，$OA,OB$满足$k_1+k_2=0$，证明$AB\\parallel$定直线。`,
tip:`斜率和为0⇒韦达一次项系数为0，直接得直线平行。`,
sts:[
`设直线$AB:mx+ny=1$`,
`齐次化：\\[\\dfrac{x^2}{4}+y^2=(mx+ny)^2\\]`,
`整理：\\[\\left(\\dfrac{1}{4}-m^2\\right)x^2-2mnxy+(1-n^2)y^2=0\\]`,
`令$k=\\dfrac{y}{x}$：\\[(1-n^2)k^2-2mnk+\\left(\\dfrac{1}{4}-m^2\\right)=0\\]`,
`由$k_1+k_2=0$：\\[\\dfrac{2mn}{1-n^2}=0\\impl m=0\\]`,
`直线为$ny=1$（$y$为常数），故：\\[\\mathbf{AB\\para x轴}\\]`],
dr(){elp(2,1,0,0)}
},

{q:`双曲线$\\dfrac{x^2}{2}-y^2=1$，过原点直线交双曲线于$A,B$，$k_1k_2=1$，证$AB\\parallel$定直线。`,
tip:`双曲线齐次化与椭圆结构一致，无逻辑漏洞。`,
sts:[
`设直线$AB:mx+ny=1$`,
`齐次化：\\[\\dfrac{x^2}{2}-y^2=(mx+ny)^2\\]`,
`整理：\\[\\left(\\dfrac{1}{2}-m^2\\right)x^2-2mnxy-(1+n^2)y^2=0\\]`,
`令$k=\\dfrac{y}{x}$：\\[-(1+n^2)k^2-2mnk+\\left(\\dfrac{1}{2}-m^2\\right)=0\\]`,
`由$k_1k_2=1$：\\[\\dfrac{\\dfrac{1}{2}-m^2}{-(1+n^2)}=1\\impl m=0\\]`,
`直线为$ny=1$，故：\\[\\mathbf{AB\\para y轴}\\]`],
dr(){hyp(Math.sqrt(2),1,0,0)}
},

{q:`抛物线$y^2=2x$，原点$O$引$OA\\perp OB$交抛物线于$A,B$，求证$AB$过定点。`,
tip:`抛物线齐次化：一次项乘$mx+ny$构造二次齐次式，结论正确。`,
sts:[
`设直线$AB:mx+ny=1$`,
`抛物线齐次化（右边×1）：\\[y^2=2x(mx+ny)\\]`,
`整理二次齐次式：\\[2mx^2+2nxy-y^2=0\\]`,
`除以$x^2$，令$k=\\dfrac{y}{x}$：\\[-k^2+2nk+2m=0\\]`,
`由$k_1k_2=-1$：\\[\\dfrac{2m}{-1}=-1\\impl m=1\\]`,
`直线为$x+ny=1$，恒过定点：\\[\\mathbf{(2,0)}\\]`],
dr(){par(1,2,0)}
}
];

// 绘图函数
function elp(a,b,fx,fy){
ctx.clearRect(0,0,520,400);axis();
ctx.strokeStyle='#327ff9';ctx.lineWidth=2;ctx.beginPath();
for(let t=0;t<6.28;t+=0.02){let x=cx+a*s*Math.cos(t);let y=cy-b*s*Math.sin(t);ctx.lineTo(x,y);}
ctx.closePath();ctx.stroke();dot(fx,fy);
}
function hyp(a,b,fx,fy){
ctx.clearRect(0,0,520,400);axis();
ctx.strokeStyle='#327ff9';ctx.lineWidth=2;ctx.beginPath();
for(let x=-3;x<=3;x+=0.02){let tx=x;let ty=Math.sqrt((tx*tx/a/a-1)*b*b);
if(isFinite(ty))ctx.lineTo(cx+tx*s,cy-ty*s);}ctx.stroke();ctx.beginPath();
for(let x=-3;x<=3;x+=0.02){let tx=x;let ty=-Math.sqrt((tx*tx/a/a-1)*b*b);
if(isFinite(ty))ctx.lineTo(cx+tx*s,cy-ty*s);}ctx.stroke();dot(fx,fy);
}
function par(p,fx,fy){
ctx.clearRect(0,0,520,400);axis();
ctx.strokeStyle='#327ff9';ctx.lineWidth=2;ctx.beginPath();
for(let x=0;x<=4;x+=0.01){let y=Math.sqrt(2*p*x);ctx.lineTo(cx+x*s,cy-y*s);}ctx.stroke();ctx.beginPath();
for(let x=0;x<=4;x+=0.01){let y=-Math.sqrt(2*p*x);ctx.lineTo(cx+x*s,cy-y*s);}ctx.stroke();dot(fx,fy);
}
function axis(){ctx.strokeStyle='#c9cdd4';ctx.beginPath();
ctx.moveTo(20,cy);ctx.lineTo(500,cy);ctx.moveTo(cx,20);ctx.lineTo(cx,380);ctx.stroke();}
function dot(x,y){
ctx.fillStyle='#f53f3f';ctx.beginPath();ctx.arc(cx+x*s,cy-y*s,5,0,7);ctx.fill();
ctx.fillStyle='#333';ctx.fillText(`(${x.toFixed(2)},${y})`,cx+x*s+10,cy-y*s+6);
}

// 修正渲染调用：MathJax 2.x用MathJax.Hub.Typeset()
function sh(){
const t=D[cur];
if(step<t.sts.length){
document.getElementById('step').innerHTML=t.sts[step];
MathJax.Hub.Typeset();
}}
function nxt(){
const t=D[cur];
if(step>=t.sts.length){alert("推导完成！");return;}
sh();step++;
}
function rst(){step=0;document.getElementById('step').innerHTML="等待开始...";D[cur].dr();}
function set(i){
cur=i;step=0;
document.querySelectorAll('.tab').forEach((e,j)=>e.classList.toggle('active',j===i));
document.getElementById('q').innerHTML=D[i].q;
document.getElementById('tip').innerHTML=D[i].tip;
rst();
}
window.onload=()=>set(0);
</script>
</body>
</html>
