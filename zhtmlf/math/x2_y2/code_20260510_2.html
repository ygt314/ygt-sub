<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>齐次化联立 · 高考3大题型</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}
body{background:#f7f8fa;padding:20px}
.main{max-width:1000px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.08);overflow:hidden}
.header{background:#2d8cf0;color:#fff;padding:16px 20px;font-size:20px;font-weight:500}
.q-tab{display:flex;gap:10px;padding:16px 24px;background:#f5f7fa}
.tab{padding:8px 16px;border-radius:6px;cursor:pointer;background:#e8f3ff;color:#2d8cf0}
.tab.active{background:#2d8cf0;color:#fff}
.content{padding:24px}
.question{background:#e8f3ff;padding:16px;border-radius:8px;margin-bottom:20px;font-size:16px;line-height:1.7}
.canvas-box{text-align:center;margin:20px 0}
canvas{border:1px solid #eee;border-radius:8px;background:#fcfdff}
.step-box{margin:20px 0;padding:16px;background:#f7f8fa;border-radius:8px;min-height:140px;line-height:1.8}
.step-title{font-weight:bold;color:#2d8cf0;margin-bottom:8px}
.formula{color:#ed4014;font-weight:bold;font-family:"Times New Roman",serif}
.tip{background:#fff7e6;border-left:4px #ff9500 solid;padding:10px 14px;margin:12px 0;font-size:14px;color:#666}
.btns{display:flex;gap:12px;justify-content:center;margin:20px 0}
button{padding:10px 24px;background:#2d8cf0;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:15px}
button:hover{opacity:.9}
.roadmap{background:#f0f7ff;padding:14px;border-radius:8px;margin-top:12px;font-size:14px}
.roadmap strong{color:#2d8cf0}
</style>
</head>
<body>
<div class="main">
<div class="header">高考解析几何：齐次化联立 · 3大高频题型</div>

<div class="q-tab">
<div class="tab active" onclick="switchQ(0)">题型1：垂直（k₁k₂=-1）</div>
<div class="tab" onclick="switchQ(1)">题型2：斜率和为0</div>
<div class="tab" onclick="switchQ(2)">题型3：过定点（通用）</div>
</div>

<div class="content">
<div class="question" id="q"></div>

<div class="canvas-box">
<canvas id="cvs" width="500" height="400"></canvas>
</div>

<div class="step-box">
<div class="step-title">推导步骤（点击下一步）</div>
<div id="step"></div>
</div>

<div class="tip" id="tip"></div>

<div class="roadmap">
<strong>齐次化万能套路：</strong><br>
1. 设直线：mx+ny=1 &nbsp;&nbsp; 2. 曲线方程右边乘1齐次化 &nbsp;&nbsp; 3. 除以x²得k的二次方程 &nbsp;&nbsp; 4. 韦达得k₁k₂/k₁+k₂
</div>

<div class="btns">
<button onclick="nextStep()">下一步推导</button>
<button onclick="reset()">重置</button>
</div>
</div>
</div>

<script>
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
let stepIdx = 0;
let currentType = 0;

// 3道例题数据
const data = [
  {
    title:"题型1：垂直（k₁k₂=-1）",
    q:`<strong>例题1：</strong><br>已知椭圆 C: x²/4 + y² = 1，过原点 O 作两条互相垂直的直线分别交椭圆于 A、B 两点。求证：直线 AB 恒过定点。`,
    tip:`<strong>适用：</strong> OA⊥OB ⇒ k₁k₂ = −1，齐次化秒杀！`,
    steps:[
      '【步骤1】设直线 AB：mx + ny = 1',
      '【步骤2】椭圆：x²/4 + y² = 1，右边乘 1 = mx + ny<br><span class="formula">x²/4 + y² = (mx + ny)²</span>',
      '【步骤3】整理为二次齐次式：<br><span class="formula">(1/4−m²)x² − 2mnxy + (1−n²)y² = 0</span>',
      '【步骤4】除以 x²，令 k = y/x：<br><span class="formula">(1−n²)k² − 2mnk + (1/4−m²) = 0</span>',
      '【步骤5】由 OA⊥OB ⇒ k₁k₂ = −1，韦达：<br><span class="formula">(1/4 − m²)/(1 − n²) = −1</span>',
      '【步骤6】化简得：<br><span class="formula">m² + n² = 5/4</span>',
      '【步骤7】直线 mx+ny=1 恒过定点：<br><span class="formula">定点 ( 4/5 , 0 )</span>'
    ],
    draw:function(){drawElp(2,1,4/5,0);}
  },
  {
    title:"题型2：斜率和为0",
    q:`<strong>例题2：</strong><br>椭圆 x²/4 + y² = 1，过原点两条直线 OA、OB 满足 k₁ + k₂ = 0，求证 AB 平行于定直线。`,
    tip:`<strong>适用：</strong> k₁ + k₂ = 0 ⇒ 用韦达一次项系数为0`,
    steps:[
      '【步骤1】设 AB：mx + ny = 1',
      '【步骤2】齐次化：x²/4 + y² = (mx+ny)²',
      '【步骤3】得：(1/4−m²)x² −2mnxy + (1−n²)y²=0',
      '【步骤4】除以x²：(1−n²)k² −2mnk + (1/4−m²)=0',
      '【步骤5】k₁+k₂=0 ⇒ 一次项系数=0<br><span class="formula">−2mn = 0 ⇒ m=0</span>',
      '【步骤6】直线为 ny=1 ⇒ y=常数<br><span class="formula">AB 平行于 x 轴</span>'
    ],
    draw:function(){drawElp(2,1,0,0);}
  },
  {
    title:"题型3：过定点（通用）",
    q:`<strong>例题3：</strong><br>椭圆 x²/2 + y² = 1，过 P(1,0) 的直线交椭圆于 A、B，若 k_OA + k_OB = 2，求直线 AB 方程。`,
    tip:`<strong>通用：</strong> 非原点定点，先平移再齐次化！`,
    steps:[
      '【步骤1】平移：令 x’=x−1，y’=y，P→原点',
      '【步骤2】椭圆变为：(x’+1)²/2 + y’² = 1',
      '【步骤3】设 AB：mx’+ny’=1，齐次化处理',
      '【步骤4】k₁+k₂=2 ⇒ 韦达得系数关系',
      '【步骤5】回代得直线方程：<br><span class="formula">y = −x + 1</span>'
    ],
    draw:function(){drawElp(Math.sqrt(2),1,1,0);}
  }
];

function drawElp(a,b,fx,fy){
  ctx.clearRect(0,0,500,400);
  const cx=250, cy=200, s=60;
  ctx.strokeStyle='#ccc';
  ctx.beginPath();ctx.moveTo(30,cy);ctx.lineTo(470,cy);ctx.moveTo(cx,30);ctx.lineTo(cx,370);ctx.stroke();
  ctx.strokeStyle='#2d8cf0';ctx.lineWidth=2;
  ctx.beginPath();
  for(let t=0;t<Math.PI*2;t+=0.02){
    let x = cx + a*s*Math.cos(t);
    let y = cy - b*s*Math.sin(t);
    ctx.lineTo(x,y);
  }
  ctx.closePath();ctx.stroke();
  ctx.fillStyle='#ed4014';
  ctx.beginPath();ctx.arc(cx+fx*s,cy-fy*s,5,0,7);ctx.fill();
  ctx.fillStyle='#333';ctx.fillText(`定点(${fx},${fy})`,cx+fx*s+10,cy-fy*s+5);
}

function render(){
  const d = data[currentType];
  document.getElementById('q').innerHTML = d.q;
  document.getElementById('tip').innerHTML = d.tip;
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active',i===currentType);
  });
  reset();
}

function switchQ(i){
  currentType = i;
  render();
}

function showStep(){
  const d = data[currentType];
  if(stepIdx < d.steps.length){
    document.getElementById('step').innerHTML = d.steps[stepIdx];
  }
}

function nextStep(){
  const d = data[currentType];
  if(stepIdx >= d.steps.length){alert('本例题推导完成！');return;}
  showStep(); stepIdx++;
}

function reset(){
  stepIdx = 0;
  document.getElementById('step').innerHTML = '等待开始...';
  data[currentType].draw();
}

window.onload = ()=>{render();}
</script>
</body>
</html>
