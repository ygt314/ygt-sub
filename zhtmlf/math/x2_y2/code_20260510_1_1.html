<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定比点差法 - 通用解析几何推导工具</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
}
:root {
    --primary: #3b82f6;
    --success: #10b981;
    --warning: #f59e0b;
    --light: #f8fafc;
    --gray: #94a3b8;
    --dark: #1e293b;
    --radius: 10px;
    --shadow: 0 4px 14px rgba(0,0,0,0.08);
}
body {
    background: #f1f5f9;
    padding: 20px;
    color: var(--dark);
    line-height: 1.6;
}
.wrapper {
    max-width: 1280px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 20px;
}
.card {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
}
.card-header {
    background: var(--primary);
    color: #fff;
    padding: 16px 20px;
    font-size: 18px;
    font-weight: 600;
}
.card-body {
    padding: 22px 24px;
}
.canvas-wrap {
    text-align: center;
    margin-bottom: 20px;
}
canvas {
    border: 2px solid var(--primary);
    border-radius: var(--radius);
    background: #fff;
    max-width: 100%;
}
.form-group {
    margin-bottom: 16px;
}
.form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: 500;
    color: var(--dark);
}
.form-control {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
}
.form-control:focus {
    border-color: var(--primary);
}
.btn {
    display: inline-block;
    padding: 10px 20px;
    border-radius: 6px;
    border: none;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
}
.btn-primary {
    background: var(--primary);
    color: #fff;
}
.btn-primary:hover {
    background: #2563eb;
}
.btn-warning {
    background: var(--warning);
    color: #fff;
}
.btn-warning:hover {
    background: #d97706;
}
.btn-group {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}
.step {
    padding: 14px 16px;
    margin-bottom: 10px;
    background: var(--light);
    border-left: 4px solid var(--primary);
    border-radius: 0 6px 6px 0;
    display: none;
}
.step.show {
    display: block;
}
.step h4 {
    color: var(--primary);
    margin-bottom: 6px;
    font-size: 16px;
}
.formula {
    font-family: "Times New Roman", serif;
    font-size: 16px;
    color: var(--dark);
    white-space: pre-line;
    line-height: 1.7;
}
.tip {
    margin-top: 8px;
    padding: 8px 12px;
    background: #fffbeb;
    border-left: 3px solid var(--warning);
    border-radius: 4px;
    font-size: 14px;
    color: #92400e;
}
.side-card .card-body {
    padding: 18px;
}
.method-tip {
    background: #ecfdf5;
    border-left: 3px solid var(--success);
    padding: 12px;
    border-radius: 6px;
    font-size: 14px;
    margin-bottom: 16px;
}
@media (max-width: 860px) {
    .wrapper {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>
<div class="wrapper">
    <!-- 主区域 -->
    <div class="card">
        <div class="card-header">定比点差法 · 动态推导</div>
        <div class="card-body">
            <div class="canvas-wrap">
                <canvas id="cvs" width="620" height="420"></canvas>
            </div>

            <div id="stepBox"></div>

            <div class="btn-group">
                <button class="btn btn-primary" id="nextBtn">下一步推导</button>
                <button class="btn btn-warning" id="resetBtn">重新开始</button>
            </div>
        </div>
    </div>

    <!-- 侧边控制面板 -->
    <div class="side-card card">
        <div class="card-header">参数设置</div>
        <div class="card-body">
            <div class="method-tip">
                <strong>定比点差法</strong><br>
                适用：向量AP=λPB、中点、定比分点问题，<br>
                优点：不用联立直线，不用韦达，计算极简。
            </div>

            <div class="form-group">
                <label>椭圆方程：x²/a² + y²/b² = 1</label>
                <input type="number" class="form-control" id="a" value="2" placeholder="a">
                <input type="number" class="form-control" id="b" value="1" placeholder="b" style="margin-top:6px">
            </div>

            <div class="form-group">
                <label>定点 P 坐标</label>
                <input type="number" class="form-control" id="px" value="1" placeholder="Px">
                <input type="number" class="form-control" id="py" value="0" placeholder="Py" style="margin-top:6px">
            </div>

            <div class="form-group">
                <label>定比 λ：向量AP = λ 向量PB</label>
                <input type="number" class="form-control" id="lambda" value="2" placeholder="λ">
            </div>

            <button class="btn btn-primary" style="width:100%" id="applyBtn">应用参数</button>
        </div>
    </div>
</div>

<script>
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
const stepBox = document.getElementById('stepBox');
const nextBtn = document.getElementById('nextBtn');
const resetBtn = document.getElementById('resetBtn');
const applyBtn = document.getElementById('applyBtn');

let stepIndex = 0;
let config = { a:2, b:1, px:1, py:0, λ:2 };
let steps = [];

// 生成推导步骤
function buildSteps() {
    const {a,b,px,py,λ} = config;
    steps = [
        {
            title: "步骤1：由向量定比得坐标关系",
            formula: `设 A(x₁,y₁)，B(x₂,y₂)，由 AP = ${λ}PB
得：(${px} - x₁, ${py} - y₁) = ${λ}(x₂ - ${px}, y₂ - ${py})
⇒ x₁ + ${λ}x₂ = ${px*(λ+1)}
⇒ y₁ + ${λ}y₂ = ${py*(λ+1)}`,
            tip: "定比条件直接转坐标等式，这是入口"
        },
        {
            title: "步骤2：A、B代入椭圆方程",
            formula: `x₁²/${a*a} + y₁²/${b*b} = 1   ①
x₂²/${a*a} + y₂²/${b*b} = 1   ②`,
            tip: "点在曲线上，方程必成立"
        },
        {
            title: "步骤3：定比点差核心：① - λ²·②",
            formula: `① - ${λ*λ}×②：
(x₁² - ${λ*λ}x₂²)/${a*a} + (y₁² - ${λ*λ}y₂²)/${b*b} = 1 - ${λ*λ}
因式分解：
(x₁-${λ}x₂)(x₁+${λ}x₂)/${a*a} + (y₁-${λ}y₂)(y₁+${λ}y₂)/${b*b} = ${1-λ*λ}`,
            tip: "高考满分套路：凑定比和式，快速消元"
        },
        {
            title: "步骤4：代入定比结果化简",
            formula: `将 x₁+${λ}x₂ = ${px*(λ+1)}，y₁+${λ}y₂ = ${py*(λ+1)} 代入
可直接解出：x₁ - ${λ}x₂ = ?，y₁ - ${λ}y₂ = ?`,
            tip: "代入后只剩简单一次方程，计算量极小"
        },
        {
            title: "步骤5：联立求解坐标",
            formula: `联立和与差，直接求出 x₁、x₂、y₁、y₂
无需直线方程，无需判别式`,
            tip: "定比点差最大优势：跳过联立，秒杀坐标"
        },
        {
            title: "步骤6：写出直线AB方程",
            formula: `由两点式 → 直线AB方程
完成求解！`,
            tip: "高考高频得分模板，速度远超常规法"
        }
    ];
}

// 渲染步骤
function renderSteps() {
    stepBox.innerHTML = '';
    steps.forEach((s,i) => {
        const div = document.createElement('div');
        div.className = 'step' + (i < stepIndex ? ' show' : '');
        div.innerHTML = `
            <h4>${s.title}</h4>
            <div class="formula">${s.formula}</div>
            <div class="tip">${s.tip}</div>
        `;
        stepBox.appendChild(div);
    });
}

// 绘图
function draw() {
    const {a,b,px,py} = config;
    ctx.clearRect(0,0,620,420);
    const cx=310, cy=210, sc=60;

    // 坐标轴
    ctx.strokeStyle='#cbd5e1';
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(40,cy); ctx.lineTo(580,cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,40); ctx.lineTo(cx,380); ctx.stroke();

    // 椭圆
    ctx.strokeStyle='#1e293b';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.ellipse(cx, cy, a*sc, b*sc, 0, 0, Math.PI*2);
    ctx.stroke();

    // 定点P
    ctx.fillStyle='#ef4444';
    ctx.beginPath();
    ctx.arc(cx + px*sc, cy - py*sc, 6, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#1e293b';
    ctx.font='14px Arial';
    ctx.fillText('P', cx + px*sc + 8, cy - py*sc + 4);

    // 直线AB（示意）
    if(stepIndex>0){
        ctx.strokeStyle='#3b82f6';
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(cx - 60, cy + 80);
        ctx.lineTo(cx + 100, cy - 60);
        ctx.stroke();
    }
}

// 下一步
function next() {
    if(stepIndex >= steps.length) { nextBtn.disabled = true; return; }
    stepIndex++;
    renderSteps();
    draw();
    nextBtn.disabled = stepIndex >= steps.length;
}

// 重置
function reset() {
    stepIndex = 0;
    renderSteps();
    draw();
    nextBtn.disabled = false;
}

// 应用参数
function applyConfig() {
    config.a = Number(document.getElementById('a').value) || 2;
    config.b = Number(document.getElementById('b').value) || 1;
    config.px = Number(document.getElementById('px').value) || 1;
    config.py = Number(document.getElementById('py').value) || 0;
    config.λ = Number(document.getElementById('lambda').value) || 2;
    buildSteps();
    reset();
}

nextBtn.addEventListener('click', next);
resetBtn.addEventListener('click', reset);
applyBtn.addEventListener('click', applyConfig);

// 初始化
buildSteps();
reset();
</script>
</body>
</html>
